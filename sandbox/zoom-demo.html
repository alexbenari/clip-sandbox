<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zoom Overlay Demo</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#0b0f14;
      --panel:#0f172a;
      --fg:#e5e7eb;
      --muted:#94a3b8;
      --accent:#7aa2f7;
      --surface-inset:#0c131f;
      --line:rgba(148,163,184,.2);
      --shadow:0 8px 24px rgba(0,0,0,.35);
    }
    *{ box-sizing:border-box; }
    ::selection{ background:var(--accent); color:var(--bg); }
    :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
    body{
      margin:0;
      min-height:100vh;
      padding:24px 16px;
      background:linear-gradient(180deg, #0b0f14 0%, #0a0e13 60%, #0b0f14 100%);
      color:var(--fg);
      font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .demo-shell{
      width:min(720px, 100%);
      margin:0 auto;
      padding:24px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
      box-shadow:var(--shadow);
    }
    h1{
      margin:0 0 8px;
      font-size:18px;
      font-weight:700;
    }
    p{
      max-width:65ch;
      margin:0 0 16px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }
    button{
      appearance:none;
      border:0;
      cursor:pointer;
      padding:10px 14px;
      border-radius:12px;
      background:linear-gradient(180deg, #2a4b9e, #1f2b6b);
      color:var(--fg);
      font-weight:600;
      letter-spacing:.2px;
      box-shadow:var(--shadow);
    }
    button:hover{ filter:brightness(1.05); }
    button:active{ transform:translateY(1px); }
  </style>
</head>
<body>
  <main class="demo-shell">
    <h1>Zoom Overlay Demo</h1>
    <p>This page is a minimal host for the reusable zoom overlay component. Click the button to open the sample clip in the same overlay used by the main app.</p>
    <button id="viewBtn" type="button">Click to View</button>
  </main>
  <div id="zoomLayerRoot"></div>
  <script type="module" src="../build/sandbox/zoom-demo.js"></script>
</body>
</html>
