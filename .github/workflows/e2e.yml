name: E2E

on:
  push:
    branches:
      - '**'

jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Cygwin toolchain
        shell: pwsh
        run: |
          $setupPath = Join-Path $env:RUNNER_TEMP 'setup-x86_64.exe'
          Invoke-WebRequest -Uri 'https://cygwin.com/setup-x86_64.exe' -OutFile $setupPath
          $expectedSha512 = '6acea47c59781c9e7f544a18d53935d59df6e44d5d52ac95ee165671b8e388820455eebf30ccc7d254b00c3d0eb694269a0f8dc84b17944c1f355dac9c5aafcc'
          $actualSha512 = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actualSha512 -ne $expectedSha512) {
            throw "Cygwin setup SHA-512 mismatch. Expected $expectedSha512; got $actualSha512."
          }
          $setupProcess = Start-Process -FilePath $setupPath -ArgumentList @(
            '-q'
            '-N'
            '-R', 'C:\cygwin64'
            '-s', 'https://mirrors.kernel.org/sourceware/cygwin/'
            '-P', 'gcc-g++,mingw64-x86_64-gcc-g++,cmake,make,python3,pkg-config'
          ) -Wait -PassThru -NoNewWindow
          if ($setupProcess.ExitCode -ne 0) {
            throw "Cygwin setup failed with exit code $($setupProcess.ExitCode)."
          }
          $requiredTools = @(
            'C:\cygwin64\bin\cmake.exe',
            'C:\cygwin64\bin\ctest.exe',
            'C:\cygwin64\bin\make.exe',
            'C:\cygwin64\bin\cygpath.exe',
            'C:\cygwin64\bin\x86_64-w64-mingw32-g++.exe'
          )
          foreach ($requiredTool in $requiredTools) {
            if (-not (Test-Path -LiteralPath $requiredTool)) {
              throw "Cygwin toolchain is missing $requiredTool."
            }
          }

      - name: Cache frame-review native toolchain
        uses: actions/cache@v4
        with:
          path: |
            tools/frame-review/.deps
            native-build/frame-review
          key: frame-review-${{ runner.os }}-${{ hashFiles('tools/frame-review/**', 'native/frame-review/**') }}
          restore-keys: |
            frame-review-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: C:\\Users\\runneradmin\\AppData\\Local\\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run unit

      - name: Bootstrap frame-review dependencies
        run: npm run frame-review:bootstrap

      - name: Build frame-review native products
        run: npm run frame-review:build

      - name: Verify frame-review native products
        run: npm run frame-review:verify

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
